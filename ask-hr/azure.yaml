# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: ask-hr-agent
requiredVersions:
  azd: ">=1.32.0"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.17"
    azure.ai.projects: ">=1.0.0-beta.8"

services:
  ai-project:
    host: azure.ai.project
    endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
    deployments:
      - name: ask-hr-gpt-4.1-mini
        model:
          format: OpenAI
          name: gpt-4.1-mini
          version: "2025-04-14"
        sku:
          name: GlobalStandard
          capacity: 10
      - name: ask-hr-gpt-6-astra
        model:
          format: OpenAI
          name: gpt-6-astra
          version: "2026-09-03"
        sku:
          name: GlobalStandard
          capacity: 100

  ask-hr:
    host: azure.ai.agent
    project: src/ask-hr
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: bundled
    uses:
      - ai-project
    kind: hosted
    name: ask-hr
    description: Ask HR answers regional HR policy questions over Responses and Activity using Foundry IQ.
    protocols:
      - protocol: responses
        version: 2.0.0
      - protocol: activity
        version: 2.0.0
    agentEndpoint:
      protocols:
        - responses
        - activity
      authorizationSchemes:
        - type: Entra
        - type: BotServiceRbac
    env:
      AZURE_AI_CLASSIFIER_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_CLASSIFIER_MODEL_DEPLOYMENT_NAME}
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      AZURE_SEARCH_ENDPOINT: ${AZURE_SEARCH_ENDPOINT}
      AZURE_SEARCH_KNOWLEDGE_BASE_NAME: ${AZURE_SEARCH_KNOWLEDGE_BASE}
      AZURE_SEARCH_KNOWLEDGE_SOURCE_NAME: ${AZURE_SEARCH_KNOWLEDGE_SOURCE}
      ASK_HR_WEB_BASE_URL: ${ASK_HR_WEB_BASE_URL}
      ASK_HR_SUPPORTED_REGIONS_JSON: '{"india":"India","finland":"Finland","hongkong":"Hong Kong"}'
      ASK_HR_GLOBAL_REGION_KEY: global
      CONNECTIONSMAP__0__CONNECTION: SERVICE_CONNECTION
      CONNECTIONSMAP__0__SERVICEURL: "*"
      AGENTAPPLICATION__USERAUTHORIZATION__HANDLERS__SEARCH__SETTINGS__TITLE: HR policy access
      AGENTAPPLICATION__USERAUTHORIZATION__HANDLERS__SEARCH__SETTINGS__TEXT: Continue with your Microsoft 365 account
      AGENTAPPLICATION__USERAUTHORIZATION__HANDLERS__SEARCH__SETTINGS__AZUREBOTOAUTHCONNECTIONNAME: ask-hr-search-sso
      AGENTAPPLICATION__USERAUTHORIZATION__HANDLERS__SEARCH__SETTINGS__ENABLESSO: "true"
      AGENTAPPLICATION__USERAUTHORIZATION__AUTO_SIGN_IN: "true"
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi

infra:
  provider: microsoft.foundry

hooks:
  postdeploy:
    windows:
      shell: pwsh
      run: ./scripts/grant_agent_search_role.ps1
