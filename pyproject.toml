[project]
name = "hr-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-documentintelligence==1.0.2",
    "azure-identity==1.26.0",
    "azure-search-documents==12.0.0",
    "azure-storage-file-datalake==12.26.0",
    "openai==3.31.0",
    "tiktoken==0.14.0",
]

[project.optional-dependencies]
evaluation = [
    "azure-ai-projects>=2.8.0",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
# Intentional sentence punctuation in Chinese policy text.
allowed-confusables = ["\uFF01", "\uFF1F"]
